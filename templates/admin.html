<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'head.html' %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Purple Link | Admin Panel</title>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="dashboard-header">
                <h1>Admin Panel</h1>
                <a href="/" class="btn btn-icon"><i class="fas fa-home"></i></a>
            </div>

            <div class="stats-grid">
                <div class="stat-card" style="grid-column: 1 / -1;">
                    <h2>Requests per Endpoint</h2>
                    <canvas id="usageChart" style="width: 100%; max-height: 300px;"></canvas>
                </div>

                <div class="stat-card">
                    <h2>Top IPs</h2>
                    <ul id="ipList" style="list-style: none; margin-top: 1rem;"></ul>
                </div>

                <div class="stat-card">
                    <h2>Top User Agents</h2>
                    <ul id="userAgentList" style="list-style: none; margin-top: 1rem;"></ul>
                </div>

                <div class="stat-card" style="grid-column: 1 / -1;">
                    <h2>Recent Requests</h2>
                    <div style="max-height: 300px; overflow-y: auto; margin-top: 1rem;">
                        <ul id="requestList" style="list-style: none;"></ul>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
