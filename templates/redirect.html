<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'head.html' %}
    <title>Redirecting...</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var seconds = {{ wait }}/1000;
            var counterElement = document.getElementById('counter');
            
            function updateCounter() {
                counterElement.innerText = seconds;
                if (seconds <= 0) {
                    window.location.href = "{{ url }}";
                } else {
                    seconds--;
                    setTimeout(updateCounter, 1000);
                }
            }
            
            updateCounter();
        });
    </script>
</head>
<body>
    <div class="redirect-container">
        <div class="loader"></div>
        <h1>Redirecting</h1>
        <p style="color: var(--text-muted); margin-top: 1rem;">
            You will be redirected to <br>
            <a href="{{ url }}" style="word-break: break-all;">{{ url }}</a><br>
            in <span id="counter" style="color: var(--primary-color); font-weight: bold;"></span> seconds.
        </p>
    </div>
</body>
</html>
