<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'head.html' %}
    <title>Purple Link | Authentication</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Protected Link</h1>
                <p style="color: var(--text-muted);">This link is password protected</p>
            </div>

            {% if error %}
                <div class="alert alert-danger" style="margin-bottom: 1.5rem;">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ path }}">
                <div class="form-group">
                    <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password to access">
                </div>
                <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">Access Link</button>
            </form>
        </div>
    </div>
</body>
</html>
