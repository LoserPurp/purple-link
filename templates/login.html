<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'head.html' %}
    <title>Purple Link | Login</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Purple Link</h1>
                <p style="color: var(--text-muted);">Please sign in to continue</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" style="margin-bottom: 1.5rem;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
